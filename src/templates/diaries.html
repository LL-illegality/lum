<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光喵日记 - Luminest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="sidebar">
        <h2>Luminest工作坊</h2>
        <a href="/">首页</a>
        <a href="/assessment">综合评估</a>
        <a href="/chat">对话测试</a>
        <a href="/stream_page">流式对话</a>
        <a href="/user_operations">用户操作</a>
        <a href="/danger_signals">危险信息监测</a>
        <a href="/emotion_monitor">表情监控</a>
        <a href="/memories">记忆管理</a>
        <a href="/diaries" class="active">光喵日记</a>
    </div>
    <div class="content">
        <div class="container">
            <h3>光喵日记</h3>
            <div style="display:flex; gap:16px; align-items:flex-start;">
                <div style="min-width:260px">
                    <div style="margin-bottom:12px; display:flex; gap:8px;">
                        <input id="date-input" type="date" />
                        <button id="btn-generate" style="padding:8px 12px; background:#1976d2;color:#fff;border:none;border-radius:6px;">生成</button>
                        <button id="btn-delete" style="padding:8px 12px; background:#d32f2f;color:#fff;border:none;border-radius:6px;">删除</button>
                    </div>
                    <div style="font-weight:600; margin-bottom:8px;">已生成的日记</div>
                    <div id="diary-list" style="background:#fff; padding:12px; border-radius:8px; box-shadow:0 2px 8px #f0f0f0; max-height:360px; overflow:auto;">
                        正在加载日记列表...
                    </div>
                </div>
                <div style="flex:1">
                    <div id="diary-content" style="white-space:pre-wrap; background:#fff; padding:16px; border-radius:8px; box-shadow:0 2px 8px #ddd; min-height:200px;">请选择日期并点击生成或查看已有日记。</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('date-input').value = new Date().toISOString().slice(0,10);
        async function loadDiary(date){
            try{
                const res = await fetch('/api/diaries?date=' + encodeURIComponent(date));
                const j = await res.json();
                document.getElementById('diary-content').textContent = j.content || '无日记';
            }catch(e){document.getElementById('diary-content').textContent = '加载失败'}
        }
        async function loadDiaryList(){
            try{
                const res = await fetch('/api/list_diaries');
                const j = await res.json();
                const listEl = document.getElementById('diary-list');
                listEl.innerHTML = '';
                const dates = Array.isArray(j.dates) ? j.dates : [];
                if(dates.length === 0){
                    listEl.textContent = '还没有生成任何日记';
                    return;
                }
                dates.slice().reverse().forEach(d=>{
                    const btn = document.createElement('button');
                    btn.textContent = d;
                    btn.style.display = 'block';
                    btn.style.width = '100%';
                    btn.style.textAlign = 'left';
                    btn.style.padding = '8px';
                    btn.style.marginBottom = '6px';
                    btn.onclick = ()=>{ document.getElementById('date-input').value = d; loadDiary(d); };
                    listEl.appendChild(btn);
                });
            }catch(e){
                document.getElementById('diary-list').textContent = '加载失败';
            }
        }
        document.getElementById('btn-generate').addEventListener('click', async ()=>{
            const date = document.getElementById('date-input').value;
            if(!date) return alert('请选择日期');
            document.getElementById('diary-content').textContent = '正在生成...';
            try{
                const res = await fetch('/api/generate_diary', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date}) });
                const j = await res.json();
                document.getElementById('diary-content').textContent = j.content || '生成失败';
            }catch(e){ document.getElementById('diary-content').textContent = '生成失败'; }
        });
        document.getElementById('btn-delete').addEventListener('click', async ()=>{
            const date = document.getElementById('date-input').value;
            if(!date) return alert('请选择日期');
            if(!confirm('确认删除该日期的日记？')) return;
            try{
                const res = await fetch('/api/delete_diary', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date}) });
                const j = await res.json();
                alert(j.message || j.status);
                if(j.status === 'success') document.getElementById('diary-content').textContent = '';
            }catch(e){ alert('删除失败'); }
        });
        // 初始加载当天日记与已生成日记列表
        const today = new Date().toISOString().slice(0,10);
        document.getElementById('date-input').value = today;
        loadDiaryList();
        loadDiary(today);
    </script>
</body>
</html>
